<!doctype html>
<!--
  Source for assets/hero.png. Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1280,640 --force-device-scale-factor=2 --virtual-time-budget=4000 \
    --screenshot=assets/hero.png "file://$PWD/assets/hero.html"
  The device screens are real Karoo 3 screenshots (screen-early.png / screen-late.png),
  taken from the debug build's simulator. Layout mirrors ../karoo-intervals-screen/assets/hero.html.
  Colors mirror DecouplingColors.kt / WBalColors.kt.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karoo Decoupling hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&family=Barlow:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --fog: #E4EAEE;
    --fog-deep: #CBD5DC;
    --ink: #14202A;
    --ink-soft: #4A5965;
    --bezel: #1C2126;
    --power: #E39B12;
    --hr: #B71C1C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(1200px 520px at 20% 0%, #F2F5F7 0%, transparent 60%),
      linear-gradient(180deg, var(--fog) 0%, var(--fog-deep) 100%);
    color: var(--ink);
    font-family: "Barlow", sans-serif;
    position: relative;
  }

  /* ---- Power vs heart rate across the bottom: the memorable element ---- */
  .ride { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; }

  /* ---- Copy ---- */
  .copy { position: absolute; left: 72px; top: 70px; width: 640px; }
  .wordmark {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800; font-size: 104px; line-height: 0.86; letter-spacing: -1px;
  }
  .wordmark span { display: block; }
  .tagline {
    margin-top: 26px;
    font-family: "Barlow Condensed", sans-serif; font-weight: 500;
    font-size: 34px; line-height: 1.15; max-width: 500px;
  }
  .sub { margin-top: 14px; font-size: 19px; line-height: 1.45; color: var(--ink-soft); max-width: 520px; }

  .legend {
    position: absolute; left: 72px; top: 450px;
    display: flex; gap: 26px; align-items: center;
    font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 20px; color: var(--ink-soft);
  }
  .legend i { display: inline-block; width: 26px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }
  .legend i.gap { height: 14px; border-radius: 3px; background: rgba(183, 28, 28, 0.22); }

  /* ---- Karoo 3 mockups ---- */
  .device {
    position: absolute; width: 300px; height: 506px;
    background: linear-gradient(160deg, #2A3037 0%, var(--bezel) 45%, #121619 100%);
    border-radius: 42px;
    box-shadow:
      0 40px 70px -30px rgba(20, 32, 42, 0.55),
      0 0 0 2px #0E1114,
      inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 24px 20px 54px;
  }
  .device::after {
    content: ""; position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    width: 92px; height: 13px; border-radius: 7px; background: #2C333A;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .btn { position: absolute; width: 6px; height: 52px; border-radius: 3px; background: #2C333A; }
  .btn.l1 { left: -5px; top: 100px; } .btn.r1 { right: -5px; top: 100px; }
  .btn.l2 { left: -5px; top: 360px; } .btn.r2 { right: -5px; top: 360px; }
  .device img { width: 100%; height: 100%; border-radius: 8px; display: block; object-fit: cover; object-position: top; }

  .early { right: 340px; top: 74px; transform: rotate(-5deg); }
  .late  { right: 60px;  top: 50px; transform: rotate(4deg); }
</style>
</head>
<body>

<svg class="ride" viewBox="0 0 1280 170" preserveAspectRatio="none" aria-hidden="true" id="ride"></svg>

<div class="copy">
  <div class="wordmark"><span>Karoo</span><span>Decoupling</span></div>
  <p class="tagline">Live aerobic decoupling and W' balance on your Hammerhead Karoo.</p>
  <p class="sub">See your heart rate drift away from your power as it happens, and how much anaerobic capacity is left for the next attack.</p>
</div>

<div class="legend">
  <span><i style="background: var(--power)"></i>Power</span>
  <span><i style="background: var(--hr)"></i>Heart rate</span>
  <span><i class="gap"></i>Drift</span>
</div>

<div class="device early">
  <span class="btn l1"></span><span class="btn r1"></span><span class="btn l2"></span><span class="btn r2"></span>
  <img src="screen-early.png" alt="">
</div>
<div class="device late">
  <span class="btn l1"></span><span class="btn r1"></span><span class="btn l2"></span><span class="btn r2"></span>
  <img src="screen-late.png" alt="">
</div>

<script>
  // A steady ride: power holds, heart rate tracks it through the first half, then drifts up.
  // Deterministic "noise" from summed sines so every render is identical.
  const W = 1280, H = 170, N = 200;
  const noise = (x, a, b, c) => Math.sin(x * a) * 0.6 + Math.sin(x * b + 1.3) * 0.3 + Math.sin(x * c + 2.1) * 0.1;
  const onset = 0.3; // HR starts to creep away from power about a third into the ride
  const pw = [], hr = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, x = t * W;
    pw.push([x, 128 + noise(i, 0.21, 0.47, 1.3) * 4.5]);
    const drift = t < onset ? 0 : Math.pow((t - onset) / (1 - onset), 1.15) * 84;
    hr.push([x, 112 - drift + noise(i, 0.13, 0.37, 1.1) * 3]);
  }
  const line = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('ride');
  const add = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };

  // Shaded drift gap from the onset: HR forward, power back.
  const from = Math.round(N * onset);
  const hrB = hr.slice(from), pwB = pw.slice(from).reverse();
  const defs = add('defs', {});
  defs.innerHTML = `
    <linearGradient id="gapfill" x1="0" x2="1">
      <stop offset="0" stop-color="#B71C1C" stop-opacity="0.04"/>
      <stop offset="0.45" stop-color="#B71C1C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B71C1C" stop-opacity="0.24"/>
    </linearGradient>`;
  add('path', { d: line(hrB) + ' ' + pwB.map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + ' Z', fill: 'url(#gapfill)' });

  add('path', { d: line(pw), fill: 'none', stroke: '#E39B12', 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: 0.9 });
  add('path', { d: line(hr), fill: 'none', stroke: '#B71C1C', 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: 0.9 });
</script>
</body>
</html>
